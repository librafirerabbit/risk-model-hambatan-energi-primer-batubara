[theme]
base = "light"
font = "sans serif"

[theme.light]
primaryColor = "#0F6CBD"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#EAF0F6"
textColor = "#172B4D"

[theme.dark]
primaryColor = "#4DA3FF"
backgroundColor = "#0E1624"
secondaryBackgroundColor = "#1B2638"
textColor = "#F3F6FA"

[theme.light.sidebar]
primaryColor = "#0F6CBD"
backgroundColor = "#EAF0F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"

[theme.dark.sidebar]
primaryColor = "#4DA3FF"
backgroundColor = "#131E2E"
secondaryBackgroundColor = "#253247"
textColor = "#F3F6FA"

[server]
headless = true

[browser]
gatherUsageStats = false
